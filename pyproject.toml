[project]
name = "oracle-notification-dispatch-lab"
description = "Oracle Notification Dispatch Lab - Oracle database layer lab for a fictional notification dispatch system"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "python-dotenv>=1.0,<2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.setuptools.packages.find]
where = ["src"]
